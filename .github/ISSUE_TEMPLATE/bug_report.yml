name: Bug Report
description: Create a report to help us improve RecallNote
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to fill out this bug report!"
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: Enter description here...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App Version / OS
      description: What version of iOS or what OS are you running the backend on?
    validations:
      required: true
