name: iOS CI

on:
  push:
    branches: [ "feat/ios-services", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./ios-app

    steps:
    - uses: actions/checkout@v3
    
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app
      
    - name: Run Tests
      run: swift test
